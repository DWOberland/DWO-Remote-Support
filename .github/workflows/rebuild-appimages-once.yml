name: Rebuild AppImage packages with verified tooling
on:
  push:
    branches:
      - codex/rebuild-all-2026-10-28
    paths:
      - .github/workflows/rebuild-appimages-once.yml

permissions:
  contents: write
  actions: read

env:
  VERSION: "1.0.0"

jobs:
  appimage:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout matching application sources
        uses: actions/checkout@v4
        with:
          ref: aac458da54dfee96683f1f6d572c59bd017a2f7a

      - name: Download the newly built Debian package
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-${{ env.VERSION }}-${{ matrix.arch }}.deb
          run-id: 40753481269
          github-token: ${{ github.token }}
          path: .

      - name: Prepare Debian package
        run: mv "rustdesk-${{ env.VERSION }}-${{ matrix.arch }}.deb" appimage/rustdesk.deb

      - name: Install verified AppImage build tooling
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libarchive-tools libfuse2
          sudo python3 -m pip install --upgrade pip setuptools wheel
          sudo python3 -m pip install --use-pep517 git+https://github.com/rustdesk-org/appimage-builder.git

      - name: Build AppImage
        run: |
          cd appimage
          sed -i "s/^    version: .*/    version: ${VERSION}/" "./AppImageBuilder-${{ matrix.arch }}.yml"
          grep -q "^    version: ${VERSION}$" "./AppImageBuilder-${{ matrix.arch }}.yml"
          sudo appimage-builder --skip-tests --recipe "./AppImageBuilder-${{ matrix.arch }}.yml"

      - name: Upload rebuilt AppImage
        uses: actions/upload-artifact@v4
        with:
          name: dwo-remote-support-appimage-${{ matrix.arch }}
          path: appimage/rustdesk-${{ env.VERSION }}-*.AppImage
          if-no-files-found: error

      - name: Publish rebuilt AppImage
        uses: softprops/action-gh-release@v1
        with:
          prerelease: true
          tag_name: nightly
          files: appimage/rustdesk-${{ env.VERSION }}-*.AppImage
